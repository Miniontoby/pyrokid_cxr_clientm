[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrokid_cxr_clientm"
authors = [
  { name="Miniontoby", email="author@example.com" },
]
description = "A python port of the com.rokid.cxr.client-m Java library."
requires-python = ">=3.7"
dependencies = ["bleak", 'pybluez;python_version<"3.9"', "tzlocal", "pycryptodome", "requests", "dataclasses_json", "faster-whisper", "numpy", "soundfile", "scipy"]
license = "GPL-3.0"
license-files = ["LICENSE*"]
keywords = ["rokid", "cxr", "client-m", "glasses", "rokid glasses", "com.rokid.cxr.client-m"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Java Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dynamic = ["version", "readme"]

[project.urls]
Homepage = "https://github.com/Miniontoby/pyrokid_cxr_clientm"
Documentation = "https://pyrokid-cxr-clientm.readthedocs.io/en/latest/"
Repository = "https://github.com/Miniontoby/pyrokid_cxr_clientm.git"
"Bug Tracker" = "https://github.com/Miniontoby/pyrokid_cxr_clientm/issues"

[tool.setuptools.dynamic]
version = {attr = "pyrokid_cxr_clientm._version.__version__"}
readme = {file = ["README.md"]}